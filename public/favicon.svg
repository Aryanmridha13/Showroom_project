<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient (#FF6700 -> #E63946) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6700" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
    
    <!-- Bolt Soft Inner Light -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0E6" />
    </linearGradient>
    
    <!-- Premium Drop Shadow -->
    <filter id="boltShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7C121A" flood-opacity="0.38"/>
    </filter>
  </defs>
  
  <!-- Rounded Brand Squircle Badge -->
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  
  <!-- Subtle Glass / Reflection Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-opacity="0.25" />

  <!-- Iconic Electric Bolt (Electric Vehicle Showroom Emblem) -->
  <path 
    d="M290 75 L170 265 H270 L222 437 L342 247 H242 Z" 
    fill="url(#boltGrad)" 
    filter="url(#boltShadow)"
    stroke="#FFFFFF" 
    stroke-width="12" 
    stroke-linejoin="round" 
    stroke-linecap="round"
  />
</svg>